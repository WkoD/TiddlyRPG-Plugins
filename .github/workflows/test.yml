name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js
      # Same version as the build of the wikis
      uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: npm
    - name: Install dependencies (tiddlywiki + flibbles graph stack, from package-lock.json)
      run: npm ci
    - name: Boot check (all plugins, de-DE)
      # A plugin of the smoke edition that is not found (e.g. the graph stack) is only a warning
      # for TiddlyWiki and the boot exits 0 - so the step fails on it.
      # bash = -eo pipefail: a failing boot still fails the step despite the tee.
      shell: bash
      run: |
        npm run smoke 2>&1 | tee smoke.log
        if grep -q "Cannot find plugin" smoke.log; then
          echo "::error::A plugin of the smoke edition was not found"
          exit 1
        fi
    - name: Tests (test/**/*.test.js, language packs included)
      run: npm test
